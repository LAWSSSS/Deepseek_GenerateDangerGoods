<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多背景批量生成</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css">
<style>main{display:block;max-width:960px;margin:30px auto}form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label.wide{grid-column:1/-1}input{width:100%;box-sizing:border-box}pre{white-space:pre-wrap;background:#10191f;padding:20px}a{color:#8bd5b7}.note{color:#acbbc4;line-height:1.7}</style></head>
<body><header><strong>多背景批量生成</strong><a href="/">返回放置工作台</a></header><main>
<p class="note">每张图片放置一个横躺物品。程序先选择承托位置，再选择视角并匹配环境。展示合格与待审图片分别保存，支持中断续跑。</p>
<form id="form"><label class="wide">背景目录<input id="backgrounds" required placeholder="例如 C:/Users/用户名/Desktop/背景图"></label>
<label>生成任务数<input id="count" type="number" min="1" max="1000" value="100" required></label>
<label>初稿后的修正轮数<input id="iterations" type="number" min="0" max="10" value="2" required></label>
<label class="wide">模型编号（留空使用启用模型；已移除 05–07 储罐）<input id="assets" placeholder="例如 1,3,8,10,13,14,17,19-1,22,31,33,37"></label>
<label>随机种子<input id="seed" type="number" min="0" value="20261110"></label>
<label>渲染设备<select id="device"><option value="OPTIX">NVIDIA OptiX</option><option value="CUDA">NVIDIA CUDA</option><option value="CPU">CPU</option></select></label>
<label>摄影风格<select id="photoStyle"><option value="scrap_gray">废钢灰强融合</option><option value="dusty_scrap">低饱和与局部扬尘（点评中）</option><option value="retain_color">保留更多本色</option></select></label>
<label>摆放方式<select id="placementMode"><option value="auto">自动选择承托与嵌入</option><option value="surface">表面放置</option><option value="combined">组合承托</option><option value="embedded">局部嵌入</option></select></label>
<label class="wide">融合方式<select id="appearance"><option value="reference">归档版摄影风格</option><option value="local">局部环境融合（小样验证中）</option><option value="native">上一版薄雾融合（诊断）</option></select></label>
<label class="wide">空气与薄雾<select id="atmosphere"><option value="auto">自动适配局部薄雾与眩光</option><option value="off">关闭空气遮蔽（诊断）</option></select></label>
<label class="wide">证据不足时<select id="uncertainPolicy"><option value="render_review">生成效果图并标注待审</option><option value="skip">跳过不确定候选</option></select></label>
<label class="wide">运行方式<select id="testMode"><option value="batch">原批量流程</option><option value="test">在线效果小样（最多 15 项）</option></select></label>
<label>尺度模式<select id="scaleMode"><option value="physical_consistent">统一物品长度与场景标定（小样）</option><option value="legacy">旧尺度估计</option></select></label>
<label>薄雾模式<select id="fogMode"><option value="local_auto">局部自动估计总雾量</option><option value="manual_extra">手动追加薄雾</option></select></label>
<label>做旧模式<select id="weathering"><option value="preserve_source">保留原貌·中度做旧（浮灰最高 0.5）</option><option value="legacy_matte">旧哑光覆盖</option></select></label>
<label>局部雾量修正倍数<input id="fogGain" type="number" min="0" max="1.5" step="0.25" value="1"></label>
<label>手动追加薄雾（%）<input id="fogExtra" type="number" min="0" max="85" step="1" value="35"></label>
<label>均匀池化格大小（1 为关闭）<input id="poolKernel" type="number" min="1" max="64" step="1" value="3"></label>
<label>表面浮灰倍率<input id="surfaceDust" type="number" min="0" max="1" step="0.05" value="0.5"></label>
<label>自动调整效果<select id="adjustEffects"><option value="yes">允许 AI 依据缺陷调整</option><option value="no">固定这三个参数</option></select></label>
<p class="note">以上三个效果仅在“在线效果小样”启用。新小样使用局部均值取光和自动总雾量；手动模式仍可复现追加 35%。浮灰与空气薄雾分开，漆面浮灰另减半，塑料保持原材质。</p>
<button id="start" type="submit">开始批量生成</button><button id="resume" type="button" class="secondary" disabled>继续此批次</button></form>
<p id="message" role="status"></p><a id="results" hidden target="_blank" rel="noopener">查看效果与验证记录</a><pre id="progress">尚未开始</pre>
<p class="note">修正达到上限时保存最佳版本。默认允许约 10%–40% 被钢料遮挡；尺度或隐藏接触证据不足时输出待审图。明确穿透、悬空或保护区冲突仍拒绝。有图率与展示合格率分别记录。</p>
</main><script>
const $=id=>document.getElementById(id);let batch=localStorage.getItem('displayBatchId');let timer;
$('backgrounds').value=localStorage.getItem('displayBackgrounds')||'';
$('photoStyle').onchange=()=>{if($('photoStyle').value==='dusty_scrap')$('appearance').value='local';};
$('appearance').onchange=()=>{if($('appearance').value!=='local'&&$('photoStyle').value==='dusty_scrap')$('photoStyle').value='scrap_gray';};
$('testMode').onchange=()=>{const test=$('testMode').value==='test';$('count').max=test?'15':'1000';if(test){if(Number($('count').value)>15)$('count').value=1;$('appearance').value='local';$('photoStyle').value='dusty_scrap';}for(const id of ['fogExtra','fogMode','fogGain','weathering','scaleMode','poolKernel','surfaceDust','adjustEffects'])$(id).disabled=!test;};
$('testMode').onchange();
async function update(){if(!batch)return;try{
const r=await fetch('/api/batches/'+batch);const data=await r.json();if(!r.ok)throw Error(data.error);
const c=data.counts||{};const stages={asset:'准备模型',scene:'分析背景',review:'复核成图',review_request:'复核图片',queued:'等待执行'};
const active=(data.active||[]).map(x=>x.id+'：'+(stages[x.stage]||x.stage)).join('\n');
const total=Object.values(c).reduce((a,b)=>a+b,0);
const images=data.generated_pngs==null?'':`已出图 ${data.generated_pngs} 张 · 有图率 ${(100*(data.image_rate||0)).toFixed(1)}%`;
const tr=data.insertion_traces;const traces=tr?`插入痕迹 · 未见 ${tr.none||0} · 不确定 ${tr.uncertain||0} · 可见 ${tr.visible||0}`:'';
const cost=data.cost_total;const costText=cost?`累计 API 估算：${cost.currency||''} ${cost.estimated_api_min==null?'未计价':cost.estimated_api_min.toFixed(4)}–${cost.estimated_api_max==null?'待核算':cost.estimated_api_max.toFixed(4)}；${cost.actual_requests} 次请求 · ${cost.reported_tokens} token（含重试，本机计算另记耗时）`:'';
$('progress').textContent=[images,`展示合格 ${c.accepted_display||0} 张（${(100*(c.accepted_display||0)/Math.max(1,total)).toFixed(1)}%） · 待审 ${c.review||0} 项 · 失败 ${c.failed||0} 项`,
traces,costText,'排队 '+(c.queued||0)+' 个 · 执行中 '+(c.running||0)+' 个',active,data.run?.error||data.process_error||'',
data.run?.seconds?'本次耗时 '+Math.round(data.run.seconds)+' 秒':'','保存位置：'+data.output].filter(Boolean).join('\n\n');
$('resume').disabled=!data.resumable;$('start').disabled=data.running;$('results').hidden=!data.has_results;
$('results').href='/api/batches/'+batch+'/files/index.html';clearTimeout(timer);if(data.running)timer=setTimeout(update,2500);
}catch(e){$('message').textContent=e.message;}}
$('form').onsubmit=async e=>{e.preventDefault();$('start').disabled=true;$('message').textContent='正在创建批次…';try{const data={backgrounds:$('backgrounds').value.trim(),count:Number($('count').value),max_iterations:Number($('iterations').value),assets:$('assets').value.split(',').map(x=>x.trim()).filter(Boolean),seed:Number($('seed').value),render_device:$('device').value,photo_style:$('photoStyle').value,appearance:$('appearance').value,atmosphere:$('atmosphere').value,placement_mode:$('placementMode').value,uncertain_policy:$('uncertainPolicy').value};
const test=$('testMode').value==='test';if(test){data.scale_mode=$('scaleMode').value;data.effects={fog_mode:$('fogMode').value,fog_gain:Number($('fogGain').value),weathering:$('weathering').value,shadow_mode:'matched_receiver',lighting:'local',fog_extra:Number($('fogExtra').value)/100,pool_kernel:Number($('poolKernel').value),surface_dust:Number($('surfaceDust').value),ai_adjust:$('adjustEffects').value==='yes'};}
const r=await fetch(test?'/api/batches/test':'/api/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error);batch=result.id;localStorage.setItem('displayBatchId',batch);localStorage.setItem('displayBackgrounds',data.backgrounds);$('message').textContent='批次已启动';await update();}catch(e){$('message').textContent=e.message;$('start').disabled=false;}};
$('resume').onclick=async()=>{const r=await fetch('/api/batches/'+batch+'/resume',{method:'POST'});const d=await r.json();$('message').textContent=r.ok?'正在继续批次':d.error;await update();};update();
</script></body></html>
